[workspace]
members = ["kaloron", "kaloron-macro", "kaloron-codec", "kaloron-rpc", "kaloron-rpc-macro"]
resolver = "3"

[workspace.dependencies]
# --- Runtime & utilities --------------------------------------------------
# General-purpose helpers used at runtime and in tests
tokio = "1.51"
anyhow = "1.0"
blake3 = "1.8.4"
bytes = "1"
futures-util = { version = "0.3", default-features = false }
http-body-util = "0.1"
hyper = "1.9"
hyper-util = "0.1"
rustls = "0.23"
rustls-pki-types = "1"
serde_json = "1"
tokio-rustls = "0.26"
typeid = "1"

# --- Procedural macro / codegen support -----------------------------------
# Token streams, parsing, and quoting used by proc-macro crates
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

# --- Declarative / helper macros -----------------------------------------
# Libraries providing macro helpers used by library code
seq-macro = "0.3"

# --- Local workspace crates -----------------------------------------------
kaloron = { path = "kaloron" }
kaloron-codec = { path = "kaloron-codec" }
kaloron-macro = { path = "kaloron-macro" }
kaloron-rpc = { path = "kaloron-rpc" }
kaloron-rpc-macro = { path = "kaloron-rpc-macro" }
